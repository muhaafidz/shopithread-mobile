<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ShopiThread MY — Caption Studio</title>
  <meta name="description" content="Mobile-first caption studio for Shopee Malaysia affiliates: BM templates, AI drafts, product CSV, 1-tap Threads posting.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon32.png">
  <link rel="apple-touch-icon" href="icons/icon192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ShopiThread MY">
  <meta name="theme-color" content="#0b1120">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

  <header class="app-header">
    <img src="icons/icon48.png" alt="ShopiThread MY">

  <main>
    <section class="tab-pane" id="pane-studio"></section>

    <section class="tab-pane" id="pane-accounts"></section>
    <section class="tab-pane" id="pane-settings"></section>
  </main>

  <nav class="bottom-nav">
    <button data-tab="studio"><span class="ico">🧵</span>Studio</button>
    <button data-tab="products"><span class="ico">📦</span>Products</button>
    <button data-tab="queue"><span class="ico">📋</span>Queue</button>

    <button data-tab="settings"><span class="ico">⚙️</span>Settings</button>
  </nav>

  <script src="vendor/market-config.js"></script>
  <script src="vendor/constants.js"></script>
  <script src="vendor/spintax.js"></script>
  <script src="vendor/threads-content-service.js"></script>

  <script src="js/db.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/views/products.js"></script>
  <script src="js/views/studio.js"></script>
  <script src="js/views/queue.js"></script>
